<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM System</title>
</head>
<body>

    <h1>ATM System</h1>

    <h2>Welcome to ATM</h2>

    <form>
        <label for="account">Account Number:</label>
        <input type="text" id="account" name="account"><br><br>

        <label for="pin">PIN:</label>
        <input type="password" id="pin" name="pin"><br><br>

        <button type="submit">Login</button>
    </form>

    <hr>

    <h2>ATM Services</h2>

    <button>Balance Inquiry</button>
    <button>Withdraw Cash</button>
    <button>Deposit Cash</button>
    <button>Fund Transfer</button>

</body>
</html>
